name: Open-Source CI & Standalone APK Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v

  mobile-checks:
    name: Mobile TypeScript & Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  android-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    needs: [backend-tests, mobile-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install JS dependencies
        working-directory: mobile
        run: npm install
      - name: Ensure debug & open-source release keystores exist
        working-directory: mobile/android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            keytool -genkeypair -v -keystore release.keystore -storepass "opensource-build-pass" -alias indiavpn -keypass "opensource-build-pass" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IndiaWireGuardVPN,O=OpenSource,C=IN"
          fi
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Release APK (bundled JS, no Metro needed)
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'opensource-build-pass' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'indiavpn' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'opensource-build-pass' }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename standalone APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk IndiaVPN-android-release.apk
      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndiaVPN-android-release-apk
          path: IndiaVPN-android-release.apk
      - name: Attach APK to GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IndiaVPN-android-release.apk
