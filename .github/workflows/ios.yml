name: iOS Build (macOS Open-Source IPA)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-ipa:
    name: Build iOS App & WireGuard Extension
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install JS dependencies
        working-directory: mobile
        run: npm install

      - name: Bundle React Native JS for iOS
        working-directory: mobile
        run: |
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios

      - name: Clone WireGuardKit & build libwg-go.a for arm64 iOS
        working-directory: mobile/ios
        run: |
          mkdir -p Vendor/build
          git clone --depth 1 https://github.com/WireGuard/wireguard-apple.git Vendor/wireguard-apple
          sed -i '' 's|swift-tools-version:5.3|swift-tools-version:5.5|' Vendor/wireguard-apple/Package.swift
          python3 -c 'from pathlib import Path; p=Path("Vendor/wireguard-apple/Sources/WireGuardKitC/WireGuardKitC.h"); p.write_text("#include <sys/types.h>\n"+p.read_text())'
          make -C Vendor/wireguard-apple/Sources/WireGuardKitGo \
            ARCHS="arm64" \
            PLATFORM_NAME="iphoneos" \
            IPHONEOS_DEPLOYMENT_TARGET="15.1" \
            DESTDIR="${PWD}/Vendor/build" \
            build version-header
          cp Vendor/build/wireguard-go-version.h Vendor/wireguard-apple/Sources/WireGuardKitGo/ || true

      - name: Generate Xcode project & install CocoaPods
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate
          RCT_NEW_ARCH_ENABLED=0 pod install

      - name: Build unsigned iOS IPA (or signed when Apple secrets are configured)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace IndiaVpnApp.xcworkspace \
            -scheme IndiaVpnApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            -quiet \
            clean build 2>&1 | tee /tmp/xcodebuild.log || {
              ERRS=$(grep -A 6 -E "Undefined symbols|error:|fatal error:|ld: " /tmp/xcodebuild.log | head -n 35 | tr '\n' ' ')
              echo "::error::${ERRS:-xcodebuild failed}"
              exit 1
            }

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/IndiaVpnApp.app"
          test -d "${APP_PATH}"
          mkdir -p build/Payload
          cp -R "${APP_PATH}" build/Payload/
          (cd build && zip -r ../../IndiaVPN-ios-unsigned.ipa Payload)

      - name: Upload unsigned iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndiaVPN-ios-unsigned-ipa
          path: IndiaVPN-ios-unsigned.ipa

      - name: Attach iOS IPA to GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IndiaVPN-ios-unsigned.ipa
