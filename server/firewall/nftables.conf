#!/usr/sbin/nft -f
# Modern nftables ruleset for a dedicated India WireGuard VPN node.
# Replace "eth0" with your actual WAN interface (e.g. ens5 on AWS EC2).

flush ruleset

define WAN_IF = eth0
define WG_IF = wg0
define WG_PORT = 51820
define WG_NET_V4 = 10.8.0.0/24
define WG_NET_V6 = fd08:8::/64

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP & ICMPv6 (essential for Path MTU Discovery)
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # SSH, HTTPS (API), WireGuard UDP
        tcp dport { 22, 443 } ct state new accept
        udp dport $WG_PORT accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept
        iifname $WG_IF oifname $WAN_IF accept

        # Prevent peer-to-peer lateral traffic unless explicitly desired
        iifname $WG_IF oifname $WG_IF drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table inet mangle {
    chain forward {
        type filter hook forward priority mangle; policy accept;
        tcp flags syn / syn,rst tcp option maxseg size set rt mtu
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr $WG_NET_V4 oifname $WAN_IF masquerade
    }
}

table ip6 nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip6 saddr $WG_NET_V6 oifname $WAN_IF masquerade
    }
}
